name: Fetch Nitric Boost image
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Nitric Boost bottle image
        run: |
          mkdir -p images
          curl -L -o images/nitric-boost.webp "https://getnitricboost.com/images/nitric%20boost%20bottle%20with%20background.webp"
          ls -lh images/nitric-boost.webp
          file images/nitric-boost.webp
      - name: Commit image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/nitric-boost.webp
          git commit -m "Add Nitric Boost bottle image" || echo "Nothing to commit"
          git push
